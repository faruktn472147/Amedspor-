<style>:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Kabuk */

.red { color: var(--red); }

.me { margin: 0 4px; display: inline-flex; }

/* Shorts */
.shorts-wrap { position: relative; }
.shorts { height: calc(100dvh - 57px - 58px - var(--sat) - var(--sab)); overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; background: #000; scrollbar-width: none; } .shorts::-webkit-scrollbar { display: none; }
.short { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; color: #fff; overflow: hidden; }
.short-stage, .short-stage video, .short-cover { position: absolute; inset: 0; width: 100%; height: 100%; } .short-stage video, .short-cover img { object-fit: contain; width: 100%; height: 100%; }
.short::after { content: ""; position: absolute; inset: auto 0 0; height: 45%; background: linear-gradient(transparent, rgb(0 0 0 / .8)); pointer-events: none; }
.short-info { position: absolute; left: 14px; right: 76px; bottom: 16px; z-index: 2; } .short-info p { margin-top: 8px; }
.short-actions { position: absolute; right: 8px; bottom: 16px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.short-act { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; } .short-act.on .ic-lg { fill: var(--red); color: var(--red); }
.short-ad { display: flex; align-items: center; padding: 16px; }
.sponsor-short { width: 100%; background: #111; color: #fff; border: 0; }
.pill { position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%); background: rgb(0 0 0 / .65); padding: 5px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.pill-btn { position: absolute; z-index: 5; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 999px; background: rgb(0 0 0 / .6); color: #fff; font-size: 12px; font-weight: 700; } .pill-btn.on { background: var(--green); }
.short-thumb { position: relative; flex: none; width: 124px; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #000; } .short-thumb img { width: 100%; height: 100%; object-fit: cover; }
.short-meta { position: absolute; inset: auto 0 0; padding: 22px 8px 8px; background: linear-gradient(transparent, rgb(0 0 0 / .8)); color: #fff; font-size: 11.5px; font-weight: 700; }
/* Sponsor */
.sponsor-top { display: flex; justify-content: space-between; padding: 10px 14px 0; font-size: 11.5px; color: var(--fg2); } .sponsor-top strong { text-transform: uppercase; letter-spacing: .04em; }
.sponsor img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; margin-top: 8px; }
.sponsor-body { display: flex; align-items: center; gap: 12px; padding: 12px 14px; } .sponsor-body > div { flex: 1; min-width: 0; }
/* Premium & yetki */
.premium { position: relative; } .price { font-size: 38px; font-weight: 900; }
.checks { list-style: none; padding: 0; margin: 0; } .checks li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 14.5px; }
.note { background: var(--mu); padding: 8px 12px; border-radius: 10px; }
.auth { max-width: 440px; margin: 10px auto 0; } .auth > * + * { margin-top: 16px; }
.danger-zone { border-color: color-mix(in srgb, var(--red) 40%, transparent); }
